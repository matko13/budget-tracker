# Pompa - nocne grzanie w taniej strefie
# ======================================
#
# v3: Dodano push notifications przy każdej zmianie setpointu
#
# HARMONOGRAM G12W:
#   Pozaszczyt → setpoint 21.5°C (grzej):
#   - 22:00 - 06:00 (noc)
#   - 13:00 - 15:00 (zima, dni robocze)
#   - 15:00 - 17:00 (lato, dni robocze)
#   - cały weekend
#
#   Szczyt → setpoint 20.5°C (nie grzej):
#   - wszystkie inne godziny w dni robocze
#
# PUSH NOTIFICATIONS:
#   - Przełączenie na pozaszczyt: "Pompa → tania taryfa"
#   - Przełączenie na szczyt: "Pompa → oszczędzanie"
#   - Reset o 22:00: "Pompa → tryb nocny"

id: "1774726746394"
alias: "Pompa - nocne grzanie w taniej strefie"
description: >
  Grzej więcej nocą (tania taryfa G12W), mniej w dzień.
  Kompatybilne z MELCloud Smart Energy.

triggers:
  - trigger: time_pattern
    minutes: "/5"
  - trigger: time
    at: "22:00:00"
    id: reset_override

conditions:
  - condition: template
    value_template: "{{ now().month in [1,2,3,4,10,11,12] }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: reset_override
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.reczne_sterowanie_ogrzewaniem
          - action: climate.set_temperature
            target:
              entity_id: climate.pompa_zone_1
            data:
              temperature: 21.5
          - action: notify.mobile_app_iphone_mateusz
            data:
              title: "🌙 Pompa → tryb nocny"
              message: "22:00 → setpoint 21.5°C (tania taryfa). Override zresetowany."
              data:
                tag: pompa_heating
                group: pompa

      - conditions:
          - condition: state
            entity_id: input_boolean.reczne_sterowanie_ogrzewaniem
            state: "off"
        sequence:
          - variables:
              hour: "{{ now().hour }}"
              weekday: "{{ now().weekday() }}"
              month: "{{ now().month }}"
          - variables:
              is_night_offpeak: "{{ hour | int >= 22 or hour | int < 6 }}"
              is_winter_midday_offpeak: "{{ hour | int >= 13 and hour | int < 15 and weekday | int < 5 and month | int in [1,2,3,10,11,12] }}"
              is_summer_midday_offpeak: "{{ hour | int >= 15 and hour | int < 17 and weekday | int < 5 and month | int in [4,5,6,7,8,9] }}"
              is_weekend: "{{ weekday | int >= 5 }}"
          - variables:
              is_cheap: "{{ is_night_offpeak or is_winter_midday_offpeak or is_summer_midday_offpeak or is_weekend }}"
              current_temp: "{{ state_attr('climate.pompa_zone_1', 'temperature') | float(0) }}"
          - variables:
              target: "{% if is_cheap %}21.5{% else %}20.5{% endif %}"
          - condition: template
            value_template: >
              {{ current_temp | float != target | float
                 and not is_state('climate.pompa_zone_1', 'unavailable') }}
          - action: climate.set_temperature
            target:
              entity_id: climate.pompa_zone_1
            data:
              temperature: "{{ target | float }}"
          - action: notify.mobile_app_iphone_mateusz
            data:
              title: "{% if is_cheap %}💲 Pompa → tania taryfa{% else %}💰 Pompa → oszczędzanie{% endif %}"
              message: >
                Setpoint {{ current_temp }}°C → {{ target }}°C
                {% if is_cheap %}(pozaszczyt G12W){% else %}(szczyt G12W - ograniczenie grzania){% endif %}.
                Pokój {{ state_attr('climate.pompa_zone_1', 'current_temperature') }}°C.
              data:
                tag: pompa_heating
                group: pompa

mode: single
